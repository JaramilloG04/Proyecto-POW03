<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Perfil académico en EDU-KT Free.">
  <title>Mi perfil | EDU-KT Free</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html"><i class="bi bi-people-fill fs-4"></i>EDU-KT Free</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir navegación"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="menuPrincipal"><ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1"><li class="nav-item"><a class="nav-link" href="inicio.html">Mi panel</a></li><li class="nav-item"><a class="nav-link active" href="perfil.html">Mi perfil</a></li><li class="nav-item"><a class="nav-link" href="index.html">Cerrar sesión</a></li><li class="nav-item ms-lg-2"><button id="themeToggle" class="btn btn-sm btn-light border" type="button" aria-label="Cambiar a modo oscuro" title="Cambiar tema"><i class="bi bi-moon-stars-fill"></i></button></li></ul></div>
    </div>
  </nav>

  <main class="dashboard-section min-vh-100 py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-9">
          <a href="inicio.html" class="small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Volver al panel</a>
          <section class="card profile-card mt-3">
            <div class="card-body p-4 p-md-5">
              <div class="d-flex flex-wrap align-items-center gap-3 border-bottom pb-4 mb-4">
                <div class="avatar avatar-large">JC</div>
                <div class="flex-grow-1"><p class="eyebrow mb-1">Perfil académico</p><h1 class="h3 fw-bold mb-1">Juan Camilo Jaramillo</h1><p class="muted-custom mb-0">Estudiante y tutor · Programación Web</p></div>
                <span class="badge text-bg-success"><i class="bi bi-check-circle me-1"></i>Perfil activo</span>
              </div>

              <form id="profileForm">
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label" for="fullName">Nombre completo</label><input class="form-control" id="fullName" value="Juan Camilo Jaramillo"></div>
                  <div class="col-md-6"><label class="form-label" for="program">Programa académico</label><input class="form-control" id="program" value="Programación Web"></div>
                  <div class="col-md-6"><label class="form-label" for="institution">Institución educativa</label><input class="form-control" id="institution" placeholder="Nombre de tu institución"></div>
                  <div class="col-md-6"><label class="form-label" for="role">Rol dentro de la red</label><select class="form-select" id="role"><option>Estudiante y tutor</option><option>Estudiante</option><option>Tutor</option></select></div>
                  <div class="col-12"><label class="form-label" for="topics">Temas que puedes compartir</label><input class="form-control" id="topics" value="HTML, CSS y fundamentos web" aria-describedby="topicsHelp"><div id="topicsHelp" class="form-text">Separa los temas con comas.</div></div>
                  <div class="col-12"><label class="form-label" for="learning">Temas que deseas aprender</label><input class="form-control" id="learning" placeholder="Ej. JavaScript, cálculo diferencial, inglés"></div>
                  <div class="col-12"><label class="form-label" for="bio">Acerca de ti</label><textarea class="form-control" id="bio" rows="4">Me interesa compartir conocimientos y aprender en comunidad.</textarea></div>
                </div>
                <div class="d-flex flex-wrap gap-2 justify-content-end mt-4"><a class="btn btn-outline-primary" href="inicio.html">Cancelar</a><button class="btn btn-primary" type="submit"><i class="bi bi-check2 me-1"></i>Guardar cambios</button></div>
              </form>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="feedbackToast" class="toast align-items-center text-bg-primary border-0" role="status" aria-live="polite" aria-atomic="true"><div class="d-flex"><div class="toast-body" id="toastMessage">Acción realizada.</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
